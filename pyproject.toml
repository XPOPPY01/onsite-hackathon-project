[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoro-engine"
version = "1.0.0"
description = "Real-Time Financial Behavior Conflict Resolution Engine for Zoro AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "python-multipart>=0.0.9"]
export = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
zoro = "zoro_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zoro_engine = ["store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "perf: performance / non-functional requirement checks",
]
filterwarnings = ["error::DeprecationWarning:zoro_engine.*"]
